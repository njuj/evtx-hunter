name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # On Windows this includes the differential tests: our parser vs. Windows' own decoder, field by field,
      # on generated logs and on the runner's real System log.
      - name: unit + differential tests
        run: python -m unittest discover -s tests -v
      - name: hunt through the demo intrusion with the installed CLI
        shell: bash
        run: |
          pip install .
          evtx-hunter --version
          evtx-hunter examples/demo --no-color || test $? -eq 1   # exit 1 = findings, as expected
